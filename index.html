<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="值班调休">
<meta name="theme-color" content="#007AFF">
<meta name="format-detection" content="telephone=no">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%20viewBox='0%200%20180%20180'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0%25'%20stop-color='%23007AFF'/%3E%3Cstop%20offset='100%25'%20stop-color='%235AC8FA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='180'%20height='180'%20rx='40'%20fill='url(%23g)'/%3E%3Ctext%20x='90'%20y='78'%20font-family='sans-serif'%20font-size='15'%20font-weight='600'%20text-anchor='middle'%20fill='rgba(255,255,255,0.85)'%3E%E5%80%BC%E7%8F%AD%E8%B0%83%E4%BC%91%3C/text%3E%3Ctext%20x='90'%20y='135'%20font-family='sans-serif'%20font-size='58'%20font-weight='700'%20text-anchor='middle'%20fill='white'%3E+1%3C/text%3E%3C/svg%3E">
<title>值班调休记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;
  --gray:#8E8E93;--bg:#F2F2F7;--card:#FFFFFF;--text:#000;
  --sep:#C6C6C8;--label:#6B6B6B;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1C1C1E;--text:#FFF;--sep:#38383A;--label:#98989F}
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5;
  overscroll-behavior-y:none;
}
#app{max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--sb) + 20px)}
/* ===== Auth Screen ===== */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{
  width:100%;max-width:360px;background:var(--card);border-radius:24px;
  padding:40px 28px 28px;text-align:center;
  box-shadow:0 4px 30px rgba(0,0,0,0.08);
}
.auth-logo{
  width:72px;height:72px;border-radius:20px;margin:0 auto 16px;
  background:linear-gradient(135deg,#007AFF,#5AC8FA);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;box-shadow:0 4px 16px rgba(0,122,255,0.3);
}
.auth-card h2{font-size:24px;font-weight:700;margin-bottom:8px}
.auth-subtitle{font-size:14px;color:var(--label);margin-bottom:28px}
.auth-form .form-group{margin-bottom:14px;text-align:left}
.auth-form .form-group label{display:block;font-size:13px;color:var(--label);margin-bottom:6px}
.auth-form .form-group input{
  width:100%;padding:12px 14px;border:0.5px solid var(--sep);border-radius:10px;
  background:var(--bg);color:var(--text);font-size:16px;outline:none;
}
.auth-form .form-group input:focus{border-color:var(--blue)}
.auth-submit{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:var(--blue);color:#fff;font-size:17px;font-weight:600;
  cursor:pointer;margin-top:8px;
}
.auth-submit:active{opacity:0.7}
.auth-toggle{margin-top:20px;font-size:14px;color:var(--blue);cursor:pointer}
.auth-hint{margin-top:16px;font-size:12px;color:var(--gray);line-height:1.6}
/* ===== Header ===== */
.header{
  position:sticky;top:0;z-index:50;
  padding:calc(var(--st) + 12px) 16px 10px;
  background:rgba(242,242,247,0.85);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid var(--sep);
}
@media(prefers-color-scheme:dark){.header{background:rgba(0,0,0,0.85)}}
.header h1{font-size:17px;font-weight:600;text-align:center}
.user-bar{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.user-email{font-size:13px;color:var(--label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.user-actions{display:flex;gap:6px;flex-shrink:0}
.admin-btn{
  border:0.5px solid var(--sep);background:var(--card);color:var(--blue);
  font-size:13px;cursor:pointer;padding:4px 12px;border-radius:8px;
}
.admin-btn:active{opacity:0.6}
.logout-btn{
  border:0.5px solid var(--sep);background:var(--card);color:var(--red);
  font-size:13px;cursor:pointer;padding:4px 12px;border-radius:8px;
}
.logout-btn:active{opacity:0.6}
/* ===== Balance Card ===== */
.balance-card{
  margin:16px 16px 0;border-radius:20px;padding:28px 20px;text-align:center;
  background:linear-gradient(135deg,#007AFF,#5AC8FA);
  color:#fff;box-shadow:0 4px 20px rgba(0,122,255,0.3);
  transition:transform .2s;
}
.balance-card.negative{background:linear-gradient(135deg,#FF3B30,#FF9500);box-shadow:0 4px 20px rgba(255,59,48,0.3)}
.balance-label{font-size:14px;opacity:0.85;margin-bottom:4px}
.balance-number{font-size:56px;font-weight:700;line-height:1.1;margin:4px 0}
.balance-number .unit{font-size:20px;font-weight:500;opacity:0.85}
.balance-detail{font-size:13px;opacity:0.8;margin-top:4px}
/* ===== Settings ===== */
.settings-card{
  margin:12px 16px 0;background:var(--card);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
}
.settings-card label{font-size:15px;color:var(--label)}
.settings-card input{
  width:64px;text-align:center;font-size:18px;font-weight:600;
  border:none;background:transparent;color:var(--text);outline:none;
}
.balance-stepper{display:flex;align-items:center;gap:8px}
.balance-stepper button{
  width:30px;height:30px;border-radius:8px;border:none;
  background:var(--bg);color:var(--blue);font-size:18px;font-weight:600;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.balance-stepper button:active{opacity:0.5}
/* ===== Section ===== */
.section{margin:24px 16px 0}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 4px}
.section-title{font-size:15px;font-weight:600;color:var(--label)}
.section-count{font-size:13px;color:var(--gray)}
.record-list{background:var(--card);border-radius:12px;overflow:hidden}
.record-item{
  display:flex;align-items:center;padding:12px 16px;
  border-bottom:0.5px solid var(--sep);cursor:pointer;position:relative;gap:8px;
}
.record-item:last-child{border-bottom:none}
.fold-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:12px;border-top:0.5px solid var(--sep);
  color:var(--blue);font-size:14px;cursor:pointer;
  background:rgba(0,122,255,0.04);
}
.fold-toggle:active{opacity:0.6}
.fold-hidden{display:none}
.duty-section-header{display:flex;align-items:center;gap:4px}
.duty-section-header .badge{
  font-size:11px;padding:1px 6px;border-radius:6px;
  background:rgba(0,122,255,0.12);color:var(--blue);
}
.record-item:active{background:var(--bg)}
.record-date{flex-shrink:0;width:100px;font-size:15px;font-weight:500}
.record-note{flex:1;font-size:14px;color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px}
.record-status{font-size:12px;padding:2px 6px;border-radius:4px;flex-shrink:0}
.status-unused{background:rgba(52,199,89,0.12);color:var(--green)}
.status-used{background:rgba(142,142,147,0.15);color:var(--gray)}
.record-badge{
  flex-shrink:0;font-size:13px;font-weight:600;width:24px;height:24px;
  border-radius:6px;display:flex;align-items:center;justify-content:center;
}
.badge-duty{background:rgba(0,122,255,0.12);color:var(--blue)}
.badge-comp{background:rgba(255,149,0,0.12);color:var(--orange)}
.delete-btn{
  flex-shrink:0;width:28px;height:28px;border:none;background:none;
  color:var(--red);font-size:18px;cursor:pointer;opacity:0.6;
  display:flex;align-items:center;justify-content:center;margin-left:4px;
}
.delete-btn:active{opacity:1}
/* ===== Empty State ===== */
.empty-state{padding:24px 16px;text-align:center;color:var(--gray);font-size:14px}
/* ===== Add Button ===== */
.add-btn{
  width:100%;margin-top:8px;padding:12px;border:none;border-radius:12px;
  background:var(--card);color:var(--blue);font-size:15px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;
}
.add-btn:active{opacity:0.6}
.add-btn.comp{color:var(--orange)}
/* ===== Data Actions ===== */
.data-actions{margin:24px 16px 0;display:flex;gap:8px}
.data-actions button,.data-actions .import-btn{
  flex:1;padding:10px 8px;border:0.5px solid var(--sep);border-radius:10px;
  background:var(--card);color:var(--blue);font-size:14px;cursor:pointer;
  text-align:center;display:block;
}
.data-actions .danger{color:var(--red)}
.data-actions input{display:none}
.data-actions button:active,.data-actions .import-btn:active{opacity:0.6}
/* ===== First Use Hint ===== */
.hint{
  margin:20px 16px 0;padding:14px 16px;border-radius:12px;
  background:rgba(255,204,0,0.12);border:0.5px solid rgba(255,204,0,0.3);
  font-size:13px;color:var(--text);line-height:1.6;
}
.hint button{margin-top:8px;padding:4px 14px;border:0.5px solid var(--sep);
  border-radius:8px;background:var(--card);color:var(--blue);font-size:13px;cursor:pointer}
/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.4);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{
  width:100%;max-width:500px;background:var(--card);border-radius:16px;
  padding:20px;transform:scale(0.95);max-height:90vh;overflow-y:auto;
  transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.modal-overlay.show .modal-sheet{transform:scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-header h2{font-size:17px;font-weight:600}
.modal-close{width:30px;height:30px;border:none;background:none;font-size:18px;color:var(--gray);cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--label);margin-bottom:6px}
.form-group input,.form-group select{
  width:100%;padding:10px 12px;border:0.5px solid var(--sep);border-radius:10px;
  background:var(--bg);color:var(--text);font-size:16px;outline:none;
}
.form-group input:focus,.form-group select:focus{border-color:var(--blue)}
.modal-footer{display:flex;gap:10px;margin-top:8px}
.btn-cancel,.btn-save{flex:1;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer}
.btn-cancel{background:var(--bg);color:var(--text)}
.btn-save{background:var(--blue);color:#fff}
.btn-cancel:active,.btn-save:active{opacity:0.7}
/* ===== Admin User Management ===== */
.admin-user-item{
  display:flex;align-items:center;padding:12px 0;
  border-bottom:0.5px solid var(--sep);gap:8px;
}
.admin-user-item:last-child{border-bottom:none}
.admin-user-info{flex:1;min-width:0}
.admin-user-email{font-size:15px;font-weight:500;display:flex;align-items:center;gap:4px}
.admin-tag{
  font-size:11px;padding:1px 6px;border-radius:4px;
  background:rgba(0,122,255,0.12);color:var(--blue);
}
.admin-user-meta{font-size:12px;color:var(--gray);margin-top:2px}
.admin-user-actions{display:flex;gap:6px;flex-shrink:0}
.admin-action-btn{
  padding:6px 12px;border:0.5px solid var(--sep);border-radius:8px;
  background:var(--card);color:var(--blue);font-size:13px;cursor:pointer;
}
.admin-action-btn.danger{color:var(--red)}
.admin-action-btn:active{opacity:0.6}
.admin-back-btn{
  width:100%;padding:10px;border:0.5px solid var(--sep);border-radius:10px;
  background:var(--card);color:var(--blue);font-size:14px;cursor:pointer;
  margin-top:12px;
}
.admin-back-btn:active{opacity:0.6}
/* ===== Toast ===== */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);
  background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:12px;
  font-size:15px;z-index:300;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* ===== Loading ===== */
.loading-overlay{
  position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.2);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.loading-overlay.show{opacity:1;pointer-events:auto}
.spinner{
  width:36px;height:36px;border:3px solid rgba(255,255,255,0.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Animations ===== */
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.balance-number.bump{animation:pop .35s ease}
</style>
</head>
<body>
<div id="app">
  <!-- ====== 登录/注册界面 ====== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">📋</div>
      <h2 id="authTitle">登录</h2>
      <div class="auth-subtitle">值班调休记录管理</div>
      <div class="auth-form">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="authEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="authPassword" placeholder="至少6位" autocomplete="current-password">
        </div>
        <button class="auth-submit" id="authSubmit" onclick="handleAuth()">登录</button>
      </div>
      <div class="auth-toggle" id="authToggle" onclick="toggleAuthMode()">没有账号？去注册</div>
      <div class="auth-hint">
        首次使用请先注册账号<br>每个账号的值班调休数据互相隔离
      </div>
    </div>
  </div>
  <!-- ====== 主应用界面（登录后显示） ====== -->
  <div id="mainApp" style="display:none">
    <div class="header">
      <h1>值班调休记录</h1>
      <div class="user-bar">
        <span class="user-email" id="userEmail"></span>
        <div class="user-actions">
          <button class="admin-btn" id="adminBtn" onclick="showAdminModal()" style="display:none">管理用户</button>
          <button class="logout-btn" onclick="signOut()">退出登录</button>
        </div>
      </div>
    </div>
    <div class="balance-card" id="balanceCard">
      <div class="balance-label">剩余调休天数</div>
      <div class="balance-number" id="balanceNumber">0<span class="unit"> 天</span></div>
      <div class="balance-detail" id="balanceDetail"></div>
    </div>
    <div class="settings-card">
      <label>初始调休天数</label>
      <div class="balance-stepper">
        <button onclick="adjustInitial(-1)">-</button>
        <input type="number" id="initialInput" value="0" min="0" style="width:50px" onchange="setInitial(this.value)">
        <button onclick="adjustInitial(1)">+</button>
      </div>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-title">📋 值班记录</span>
        <span class="section-count" id="dutyCount"></span>
      </div>
      <div class="record-list" id="dutyList"></div>
      <button class="add-btn" onclick="showAddModal('duty')">+ 添加值班记录</button>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-title">🏖️ 调休记录</span>
        <span class="section-count" id="compCount"></span>
      </div>
      <div class="record-list" id="compList"></div>
      <button class="add-btn comp" onclick="showAddModal('comp')">+ 添加调休记录</button>
    </div>
    <div class="data-actions">
      <button onclick="exportData()">导出数据</button>
      <label class="import-btn">导入数据<input type="file" accept=".json" onchange="importData(event)"></label>
      <button class="danger" onclick="clearAllData()">清空数据</button>
    </div>
    <div class="hint" id="hintBox">
      <p>💡 在 Safari 中点击底部「分享」按钮，选择「添加到主屏幕」，即可像 App 一样全屏使用，支持离线。</p>
      <button onclick="document.getElementById('hintBox').style.display='none';localStorage.setItem('hintDismissed','1')">知道了</button>
    </div>
  </div>
</div>
<!-- ====== 添加/编辑记录弹窗 ====== -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)hideModal()">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2 id="modalTitle">添加记录</h2>
      <button class="modal-close" onclick="hideModal()">✕</button>
    </div>
    <div class="form-group">
      <label>日期</label>
      <input type="date" id="recordDate">
    </div>
    <div class="form-group" id="dutyTypeWrap">
      <label>值班类型</label>
      <select id="dutyType">
        <option value="工作日夜班">工作日夜班</option>
        <option value="休息日白班">休息日白班</option>
        <option value="休息日夜班">休息日夜班</option>
      </select>
    </div>
    <div class="form-group" id="selectDutyWrap" style="display:none;">
      <label>选择要调休的值班</label>
      <select id="selectDutyItem"></select>
    </div>
    <div class="form-group" id="noteInputWrap">
      <label>备注（可选）</label>
      <input type="text" id="recordNote" placeholder="如：周末值班 / 周五调休" maxlength="50">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="hideModal()">取消</button>
      <button class="btn-save" id="btnSave" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>
<!-- ====== 管理员用户管理弹窗 ====== -->
<div class="modal-overlay" id="adminOverlay" onclick="if(event.target===this)hideAdminModal()">
  <div class="modal-sheet" style="max-height:85vh;overflow-y:auto">
    <div class="modal-header">
      <h2 id="adminTitle">用户管理</h2>
      <button class="modal-close" onclick="hideAdminModal()">✕</button>
    </div>
    <!-- 用户列表视图 -->
    <div id="adminUserListView">
      <div id="adminUserList"></div>
    </div>
    <!-- 用户数据视图 -->
    <div id="adminDataView" style="display:none">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px" id="adminDataTitle"></div>
      <div class="balance-card" id="adminBalanceCard" style="margin:0 0 16px">
        <div class="balance-label">剩余调休天数</div>
        <div class="balance-number" id="adminBalanceNumber">0<span class="unit"> 天</span></div>
        <div class="balance-detail" id="adminBalanceDetail"></div>
      </div>
      <div class="section" style="margin:0 0 16px">
        <div class="section-header">
          <span class="section-title">📋 值班记录</span>
          <span class="section-count" id="adminDutyCount"></span>
        </div>
        <div class="record-list" id="adminDutyList"></div>
      </div>
      <div class="section" style="margin:0 0 16px">
        <div class="section-header">
          <span class="section-title">🏖️ 调休记录</span>
          <span class="section-count" id="adminCompCount"></span>
        </div>
        <div class="record-list" id="adminCompList"></div>
      </div>
      <button class="admin-back-btn" onclick="backToUserList()">← 返回用户列表</button>
    </div>
  </div>
</div>
<!-- ====== Loading 遮罩 ====== -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>
<script>
(function(){
  'use strict';
  // ============ Supabase 配置 ============
  const SUPABASE_URL = "https://zotnonwudryjspkkbugl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_OfgEnMd4ouQ6gY3sXqJ2XQ_95tIEh0Y";
  const { createClient } = window.supabase;
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const KEY='dutyCompTracker_v1';
  const OFFLINE_QUEUE_KEY = "duty_offline_queue";
  var data={dutyRecords:[],compRecords:[],initialBalance:0};
  var modalMode='add',modalType='duty',editId=null;
  var currentUser=null;
  var isLoginMode=true;
  var isAdmin=false;

  // ==================== 用户认证 ====================
  function showLoading(show){
    document.getElementById('loadingOverlay').classList.toggle('show',show);
  }
  function showAuthScreen(){
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('mainApp').style.display='none';
  }
  function showMainApp(){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
    if(currentUser){
      document.getElementById('userEmail').textContent=currentUser.email||'';
    }
  }
  async function checkAdmin(){
    try{
      var res=await supabase.rpc('is_admin');
      isAdmin=(res.data===true);
    }catch(e){isAdmin=false}
    document.getElementById('adminBtn').style.display=isAdmin?'':'none';
  }
  window.toggleAuthMode=function(){
    isLoginMode=!isLoginMode;
    document.getElementById('authTitle').textContent=isLoginMode?'登录':'注册';
    document.getElementById('authSubmit').textContent=isLoginMode?'登录':'注册';
    document.getElementById('authToggle').textContent=isLoginMode?'没有账号？去注册':'已有账号？去登录';
  };
  window.handleAuth=async function(){
    var email=document.getElementById('authEmail').value.trim();
    var password=document.getElementById('authPassword').value;
    if(!email||!password){toast('请输入邮箱和密码');return;}
    if(password.length<6){toast('密码至少6位');return;}
    showLoading(true);
    try{
      if(isLoginMode){
        var res=await supabase.auth.signInWithPassword({email:email,password:password});
        if(res.error){toast(res.error.message||'登录失败');}
        else{toast('登录成功');}
      }else{
        var res2=await supabase.auth.signUp({email:email,password:password});
        if(res2.error){toast(res2.error.message||'注册失败');}
        else if(res2.data&&res2.data.session){
          toast('注册成功，已自动登录');
        }else{
          toast('注册成功，请查收邮箱确认后登录');
          toggleAuthMode();
        }
      }
    }catch(e){
      toast('操作失败，请检查网络');
    }finally{
      showLoading(false);
    }
  };
  window.signOut=async function(){
    if(!confirm('确认退出登录？'))return;
    await supabase.auth.signOut();
  };
  document.getElementById('authPassword').addEventListener('keydown',function(e){
    if(e.key==='Enter')handleAuth();
  });
  document.getElementById('authEmail').addEventListener('keydown',function(e){
    if(e.key==='Enter')document.getElementById('authPassword').focus();
  });

  // ==================== 管理员功能 ====================
  window.showAdminModal=async function(){
    document.getElementById('adminOverlay').classList.add('show');
    document.getElementById('adminUserListView').style.display='';
    document.getElementById('adminDataView').style.display='none';
    await loadUserList();
  };
  window.hideAdminModal=function(){
    document.getElementById('adminOverlay').classList.remove('show');
  };
  window.backToUserList=function(){
    document.getElementById('adminDataView').style.display='none';
    document.getElementById('adminUserListView').style.display='';
  };
  async function loadUserList(){
    showLoading(true);
    try{
      var resU=await supabase.from('profiles').select('*').order('created_at',{ascending:false});
      if(resU.error){toast('加载用户列表失败');return;}
      var users=resU.data||[];
      // 加载所有记录用于统计
      var resR=await supabase.from('duty_log').select('user_id,type');
      var allRecords=resR.data||[];
      var counts={};
      allRecords.forEach(function(r){
        if(!counts[r.user_id])counts[r.user_id]={duty:0,comp:0};
        if(r.type==='duty')counts[r.user_id].duty++;
        else if(r.type==='rest')counts[r.user_id].comp++;
      });
      // 加载所有配置用于初始值
      var resC=await supabase.from('duty_config').select('user_id,initial_balance');
      var balances={};
      (resC.data||[]).forEach(function(c){
        balances[c.user_id]=c.initial_balance||0;
      });
      var html='';
      if(users.length===0){
        html='<div class="empty-state">暂无注册用户</div>';
      }else{
        users.forEach(function(u){
          var c=counts[u.user_id]||{duty:0,comp:0};
          var bal=(balances[u.user_id]||0)+c.duty-c.comp;
          var dateStr=u.created_at?u.created_at.split('T')[0]:'';
          var isAdminUser=(u.email==='admin@duty.local');
          html+='<div class="admin-user-item">'
            +'<div class="admin-user-info">'
            +'<div class="admin-user-email">'+escapeHtml(u.email||'未知')
            +(isAdminUser?'<span class="admin-tag">管理员</span>':'')+'</div>'
            +'<div class="admin-user-meta">注册: '+dateStr
            +' · 值班: '+c.duty
            +' · 调休: '+c.comp
            +' · 剩余: '+bal+'</div>'
            +'</div>'
            +'<div class="admin-user-actions">'
            +'<button class="admin-action-btn" onclick="viewUserData(\''+u.user_id+'\',\''+escapeHtml(u.email||'')+'\')">查看</button>'
            +'<button class="admin-action-btn danger" onclick="deleteUser(\''+u.user_id+'\',\''+escapeHtml(u.email||'')+'\')">删除</button>'
            +'</div>'
            +'</div>';
        });
      }
      document.getElementById('adminUserList').innerHTML=html;
    }finally{
      showLoading(false);
    }
  }
  window.viewUserData=async function(userId,email){
    document.getElementById('adminUserListView').style.display='none';
    document.getElementById('adminDataView').style.display='';
    document.getElementById('adminDataTitle').textContent=email+' 的记录';
    showLoading(true);
    try{
      var resR=await supabase.from('duty_log').select('*').eq('user_id',userId).order('create_at',{ascending:false});
      var resC=await supabase.from('duty_config').select('*').eq('user_id',userId).limit(1);
      var rows=resR.data||[];
      var cfgRows=resC.data||[];
      var dutyRecords=[];
      var compRecords=[];
      var initialBalance=0;
      rows.forEach(function(r){
        if(r.type==='duty'){
          dutyRecords.push({date:r.create_at.split('T')[0],duty_type:r.duty_type,is_used:!!r.is_used});
        }else if(r.type==='rest'){
          compRecords.push({date:r.create_at.split('T')[0],note:r.note||''});
        }
      });
      if(cfgRows.length>0)initialBalance=cfgRows[0].initial_balance||0;
      var bal=initialBalance+dutyRecords.length-compRecords.length;
      // 渲染余额卡片
      document.getElementById('adminBalanceNumber').innerHTML=bal+'<span class="unit"> 天</span>';
      document.getElementById('adminBalanceCard').classList.toggle('negative',bal<0);
      document.getElementById('adminBalanceDetail').textContent='初始 '+initialBalance+' + 值班 '+dutyRecords.length+' - 调休 '+compRecords.length;
      document.getElementById('adminDutyCount').textContent=dutyRecords.length+' 条';
      document.getElementById('adminCompCount').textContent=compRecords.length+' 条';
      // 渲染值班列表（只读）
      var dutyHtml='';
      if(dutyRecords.length===0){
        dutyHtml='<div class="empty-state">暂无记录</div>';
      }else{
        dutyRecords.sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:0});
        dutyRecords.forEach(function(r){
          var st=r.is_used?'已调休':'未调休';
          var sc=r.is_used?'status-used':'status-unused';
          dutyHtml+='<div class="record-item" style="cursor:default">'
            +'<div class="record-date">'+fmtDate(r.date)+'</div>'
            +'<div class="record-note">'+escapeHtml(r.duty_type||'')+'</div>'
            +'<span class="record-status '+sc+'">'+st+'</span>'
            +'<div class="record-badge badge-duty">+1</div>'
            +'</div>';
        });
      }
      document.getElementById('adminDutyList').innerHTML=dutyHtml;
      // 渲染调休列表（只读）
      var compHtml='';
      if(compRecords.length===0){
        compHtml='<div class="empty-state">暂无记录</div>';
      }else{
        compRecords.sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:0});
        compRecords.forEach(function(r){
          compHtml+='<div class="record-item" style="cursor:default">'
            +'<div class="record-date">'+fmtDate(r.date)+'</div>'
            +'<div class="record-note">'+escapeHtml(r.note||'')+'</div>'
            +'<div class="record-badge badge-comp">-1</div>'
            +'</div>';
        });
      }
      document.getElementById('adminCompList').innerHTML=compHtml;
    }finally{
      showLoading(false);
    }
  };
  window.deleteUser=async function(userId,email){
    if(!confirm('确认删除用户 '+email+' 及其所有数据？此操作不可恢复！'))return;
    showLoading(true);
    try{
      var res=await supabase.rpc('delete_user',{target_uid:userId});
      if(res.error){
        toast('删除失败: '+(res.error.message||'未知错误'));
      }else{
        toast('用户 '+email+' 已删除');
        await loadUserList();
      }
    }catch(e){
      toast('删除失败');
    }finally{
      showLoading(false);
    }
  };

  // ==================== 离线队列 ====================
  function getOfflineQueue(){
    var raw=localStorage.getItem(OFFLINE_QUEUE_KEY);
    return raw?JSON.parse(raw):[];
  }
  function saveOfflineQueue(q){
    localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(q));
  }
  async function syncOfflineQueue(){
    var queue=getOfflineQueue();
    if(!queue.length)return true;
    var okCount=0;
    for(var i=0;i<queue.length;i++){
      var item=queue[i];
      if(currentUser&&item.user_id&&item.user_id!==currentUser.id)continue;
      var res=await supabase.from("duty_log").insert(item);
      if(!res.error)okCount++;
    }
    if(okCount>0){
      saveOfflineQueue(queue.slice(okCount));
    }
    return okCount>0;
  }

  // ==================== 云端数据读写 ====================
  async function loadCloud(){
    if(!currentUser)return false;
    // 代码层显式过滤 + RLS 双重保障
    var res1=await supabase.from("duty_log").select("*")
      .eq("user_id",currentUser.id)
      .order("create_at",{ascending:false});
    var res2=await supabase.from("duty_config").select("*")
      .eq("user_id",currentUser.id)
      .limit(1);
    if(res1.error||res2.error){
      toast("云端读取失败，使用本地缓存");
      return false;
    }
    var rows=res1.data||[];
    var cfgRows=res2.data||[];
    data.dutyRecords=[];
    data.compRecords=[];
    rows.forEach(function(r){
      if(r.type==="duty"){
        data.dutyRecords.push({
          id:String(r.id),dbId:r.id,
          date:r.create_at.split('T')[0],
          note:r.note||"",
          duty_type:r.duty_type||"工作日夜班",
          is_used:!!r.is_used,
          createdAt:r.create_at
        });
      }else if(r.type==="rest"){
        data.compRecords.push({
          id:String(r.id),dbId:r.id,
          date:r.create_at.split('T')[0],
          note:r.note||"",
          createdAt:r.create_at
        });
      }
    });
    if(cfgRows.length>0){
      data.initialBalance=Number(cfgRows[0].initial_balance)||0;
    }else{
      data.initialBalance=0;
    }
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  }
  async function saveInitialToCloud(val){
    if(!currentUser)return;
    var payload={user_id:currentUser.id,initial_balance:val};
    var res=await supabase.from("duty_config").upsert([payload],{onConflict:'user_id'});
    if(res.error){
      toast("网络异常，初始值暂存本地");
    }
  }
  async function addRecordCloud(type,dateStr,note,dutyType,isUsed){
    var rest_change=type==='duty'?1:-1;
    var payload={
      type:type==='duty'?'duty':'rest',
      note:note,
      duty_type:dutyType,
      is_used:isUsed||false,
      rest_change:rest_change,
      create_at:dateStr+"T00:00:00Z",
      user_id:currentUser?currentUser.id:null
    };
    try{
      var res=await supabase.from("duty_log").insert(payload);
      if(res.error)throw res.error;
      return{ok:true};
    }catch(e){
      var q=getOfflineQueue();
      q.push(payload);
      saveOfflineQueue(q);
      toast("网络异常，存入本地队列，联网自动同步");
      return{ok:false,offline:true};
    }
  }
  async function updateDutyUsedCloud(dbId,isUsed){
    try{
      var res=await supabase.from("duty_log").update({is_used:isUsed}).eq("id",Number(dbId));
      if(res.error)throw res.error;
      return{ok:true};
    }catch(e){
      toast("更新值班状态失败");
      return{ok:false};
    }
  }
  async function updateRecordCloud(dbId,newNote,newDate,newDutyType){
    try{
      var res=await supabase.from("duty_log")
        .update({note:newNote,create_at:newDate+"T00:00:00Z",duty_type:newDutyType})
        .eq("id",dbId);
      if(res.error)throw res.error;
      return{ok:true};
    }catch(e){
      toast("云端更新失败，请检查网络");
      return{ok:false};
    }
  }
  async function delRecordCloud(dbId){
    try{
      var res=await supabase.from("duty_log").delete().eq("id",Number(dbId));
      if(res.error)throw res.error;
      return{ok:true};
    }catch(e){
      toast("删除失败，请检查网络");
      return{ok:false};
    }
  }

  // ==================== 本地缓存 ====================
  function load(){
    try{var s=localStorage.getItem(KEY);if(s){data=JSON.parse(s)}}catch(e){}
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('存储失败')}
  }
  function balance(){
    return data.initialBalance+data.dutyRecords.length-data.compRecords.length;
  }

  // ==================== 工具函数 ====================
  function todayStr(){
    var d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmtDate(s){
    var d=new Date(s+'T00:00:00');
    var now=new Date(),sameYear=d.getFullYear()===now.getFullYear();
    var m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');
    var wk=['日','一','二','三','四','五','六'][d.getDay()];
    return sameYear?m+'月'+da+'日 周'+wk:d.getFullYear()+'年'+m+'月'+da+'日 周'+wk;
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function toast(msg){
    var t=document.createElement('div');t.className='toast';t.textContent=msg;
    document.body.appendChild(t);
    requestAnimationFrame(function(){t.classList.add('show')});
    setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},1800);
  }
  function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

  // ==================== 渲染 ====================
  function render(){
    var bal=balance();
    var bn=document.getElementById('balanceNumber');
    bn.innerHTML=bal+'<span class="unit"> 天</span>';
    bn.classList.remove('bump');void bn.offsetWidth;bn.classList.add('bump');
    document.getElementById('balanceCard').classList.toggle('negative',bal<0);
    document.getElementById('balanceDetail').textContent=
      '初始 '+data.initialBalance+' + 值班 '+data.dutyRecords.length+' - 调休 '+data.compRecords.length;
    // 值班计数改为"未调休"数量
    var unusedCount=(data.dutyRecords||[]).filter(function(r){return!r.is_used}).length;
    document.getElementById('dutyCount').textContent=unusedCount+' 条（未调休）';
    document.getElementById('compCount').textContent=data.compRecords.length+' 条';
    renderList('duty');
    renderList('comp');
  }
  var foldState={duty:false,comp:false};
  function renderList(type){
    var arr=type==='duty'?data.dutyRecords:data.compRecords;
    var el=document.getElementById(type+'List');
    if(arr.length===0){el.innerHTML='<div class="empty-state">暂无记录</div>';return}
    arr.sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:0});
    var badge=type==='duty'?'badge-duty':'badge-comp';
    var symbol=type==='duty'?'+1':'-1';
    var html='';
    var visible=[];
    var hidden=[];
    
    if(type==='duty'){
      // 值班记录：只展示未调休的，超过5条折叠
      var unused=arr.filter(function(r){return!r.is_used});
      if(unused.length===0){el.innerHTML='<div class="empty-state">暂无未调休记录</div>';return}
      visible=unused.slice(0,5);
      hidden=unused.slice(5);
    }else{
      // 调休记录：展示全部但超过3条折叠（最新的在前）
      visible=arr.slice(0,3);
      hidden=arr.slice(3);
    }
    
    // 渲染可见部分
    for(var i=0;i<visible.length;i++){
      html+=buildRecordItem(type,visible[i],badge,symbol);
    }
    
    // 渲染折叠部分（如果展开则显示）
    if(hidden.length>0){
      var isFolded=!foldState[type];
      for(var j=0;j<hidden.length;j++){
        html+='<div class="record-item'+(isFolded?' fold-hidden':'')+'" data-fold="'+type+'" onclick="editRecord(\''+type+'\',\''+hidden[j].id+'\')">'
          +(type==='duty'?buildDutyItemContent(hidden[j],badge,symbol):buildCompItemContent(hidden[j],badge,symbol))
          +'</div>';
      }
      html+='<div class="fold-toggle" onclick="toggleFold(\''+type+'\')">'
        +'<span>'+(isFolded?'▼ 展开 '+hidden.length+' 条记录':'▲ 收起')+'</span>'
        +'</div>';
    }
    
    el.innerHTML=html;
  }
  function buildRecordItem(type,r,badge,symbol){
    return '<div class="record-item" onclick="editRecord(\''+type+'\',\''+r.id+'\')">'
      +(type==='duty'?buildDutyItemContent(r,badge,symbol):buildCompItemContent(r,badge,symbol))
      +'</div>';
  }
  function buildDutyItemContent(r,badge,symbol){
    var statusText=r.is_used?"已调休":"未调休";
    var statusCls=r.is_used?"status-used":"status-unused";
    return '<div class="record-date">'+fmtDate(r.date)+'</div>'
      +'<div class="record-note">'+escapeHtml(r.duty_type||r.note||'')+'</div>'
      +'<span class="record-status '+statusCls+'">'+statusText+'</span>'
      +'<div class="record-badge '+badge+'">'+symbol+'</div>'
      +'<button class="delete-btn" onclick="event.stopPropagation();delRecord(\'duty\',\''+r.id+'\')">×</button>';
  }
  function buildCompItemContent(r,badge,symbol){
    return '<div class="record-date">'+fmtDate(r.date)+'</div>'
      +'<div class="record-note">'+escapeHtml(r.note||'')+'</div>'
      +'<div class="record-badge '+badge+'">'+symbol+'</div>'
      +'<button class="delete-btn" onclick="event.stopPropagation();delRecord(\'comp\',\''+r.id+'\')">×</button>';
  }
  window.toggleFold=function(type){
    foldState[type]=!foldState[type];
    renderList(type);
  };

  // ==================== 弹窗 ====================
  window.showAddModal=function(type){
    modalMode='add';modalType=type;editId=null;
    document.getElementById('modalTitle').textContent=type==='duty'?'添加值班记录':'添加调休记录';
    document.getElementById('recordDate').value=todayStr();
    document.getElementById('recordNote').value='';
    document.getElementById('btnSave').textContent='保存';
    if(type==='duty'){
      document.getElementById('dutyTypeWrap').style.display='block';
      document.getElementById('selectDutyWrap').style.display='none';
      document.getElementById('noteInputWrap').style.display='none';
    }else{
      document.getElementById('dutyTypeWrap').style.display='none';
      document.getElementById('selectDutyWrap').style.display='block';
      document.getElementById('noteInputWrap').style.display='none';
      var sel=document.getElementById("selectDutyItem");
      sel.innerHTML="";
      var unusedList=data.dutyRecords.filter(function(d){return!d.is_used});
      if(unusedList.length===0){
        sel.innerHTML="<option value=''>暂无未调休值班记录</option>";
      }else{
        unusedList.forEach(function(d){
          sel.innerHTML+='<option value="'+d.dbId+'">'+fmtDate(d.date)+' | '+escapeHtml(d.duty_type)+'</option>';
        });
      }
    }
    showModal();
  };
  window.editRecord=function(type,id){
    var arr=type==='duty'?data.dutyRecords:data.compRecords;
    var r=null;
    for(var i=0;i<arr.length;i++){if(arr[i].id===id){r=arr[i];break}}
    if(!r)return;
    modalMode='edit';modalType=type;editId=id;
    document.getElementById('modalTitle').textContent=type==='duty'?'编辑值班记录':'编辑调休记录';
    document.getElementById('recordDate').value=r.date;
    if(type==='duty'){
      document.getElementById('dutyTypeWrap').style.display='block';
      document.getElementById('selectDutyWrap').style.display='none';
      document.getElementById('noteInputWrap').style.display='none';
      document.getElementById("dutyType").value=r.duty_type||"工作日夜班";
    }else{
      document.getElementById('dutyTypeWrap').style.display='none';
      document.getElementById('selectDutyWrap').style.display='none';
      document.getElementById('noteInputWrap').style.display='block';
      document.getElementById('recordNote').value=r.note||'';
    }
    document.getElementById('btnSave').textContent='更新';
    showModal();
  };
  function showModal(){document.getElementById('modalOverlay').classList.add('show');}
  window.hideModal=function(){document.getElementById('modalOverlay').classList.remove('show')};
  window.saveRecord=async function(){
    var dateVal=document.getElementById('recordDate').value;
    if(!dateVal){toast('请选择日期');return}
    var arr=modalType==='duty'?data.dutyRecords:data.compRecords;
    if(modalMode==='add'){
      if(modalType==='duty'){
        var dutyTypeVal=document.getElementById("dutyType").value;
        await addRecordCloud('duty',dateVal,dutyTypeVal,dutyTypeVal,false);
        arr.push({id:uid(),date:dateVal,note:dutyTypeVal,duty_type:dutyTypeVal,is_used:false,createdAt:new Date().toISOString()});
        save();render();hideModal();
        toast('值班 +1');
        await syncOfflineQueue();
        await loadCloud();render();
      }else{
        var selDbId=document.getElementById("selectDutyItem").value;
        if(!selDbId){toast("请选择一条值班记录");return;}
        var targetDuty=data.dutyRecords.find(function(x){return x.dbId==selDbId});
        if(!targetDuty){toast("找不到该值班记录");return;}
        var noteText=fmtDate(targetDuty.date)+' 休'+targetDuty.duty_type;
        await addRecordCloud('rest',dateVal,noteText,"",false);
        data.compRecords.push({id:uid(),date:dateVal,note:noteText,createdAt:new Date().toISOString()});
        targetDuty.is_used=true;
        await updateDutyUsedCloud(selDbId,true);
        save();render();hideModal();
        toast('调休 -1，对应值班标记已调休');
        await syncOfflineQueue();
        await loadCloud();render();
      }
    }else{
      var targetItem=null;
      for(var i=0;i<arr.length;i++){
        if(arr[i].id===editId){
          arr[i].date=dateVal;
          targetItem=arr[i];
          break;
        }
      }
      if(modalType==="duty"){
        var dtVal=document.getElementById("dutyType").value;
        targetItem.duty_type=dtVal;
        targetItem.note=dtVal;
      }else{
        targetItem.note=document.getElementById("recordNote").value.trim();
      }
      save();render();hideModal();
      if(targetItem&&targetItem.dbId){
        var newDutyType=targetItem.duty_type||"";
        var updateRes=await updateRecordCloud(targetItem.dbId,targetItem.note,dateVal,newDutyType);
        if(updateRes.ok){
          toast('已保存，同步云端');
          await loadCloud();render();
        }else{
          toast('本地已改，云端更新失败');
        }
      }else{
        toast('仅本地更新，无云端id');
      }
    }
  };
  window.delRecord=async function(type,id){
    var arr=type==='duty'?data.dutyRecords:data.compRecords;
    var label=type==='duty'?'值班':'调休';
    if(!confirm('确认删除这条'+label+'记录？'))return;
    var item=arr.find(function(x){return x.id===id});
    if(item&&item.dbId){
      await delRecordCloud(item.dbId);
    }
    if(type==='duty'){data.dutyRecords=data.dutyRecords.filter(function(r){return r.id!==id})}
    else{data.compRecords=data.compRecords.filter(function(r){return r.id!==id})}
    save();render();toast('已删除');
    await loadCloud();render();
  };

  // ==================== 设置 ====================
  window.setInitial=async function(v){
    v=parseInt(v)||0;if(v<0)v=0;data.initialBalance=v;
    save();render();
    await saveInitialToCloud(v);
  };
  window.adjustInitial=async function(delta){
    data.initialBalance=Math.max(0,data.initialBalance+delta);
    document.getElementById('initialInput').value=data.initialBalance;
    save();render();
    await saveInitialToCloud(data.initialBalance);
  };

  // ==================== 数据管理 ====================
  window.exportData=function(){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='duty_comp_'+todayStr()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    toast('已导出');
  };
  window.importData=async function(ev){
    var f=ev.target.files[0];if(!f)return;
    var reader=new FileReader();
    reader.onload=async function(e){
      try{
        var d=JSON.parse(e.target.result);
        if(!Array.isArray(d.dutyRecords)||!Array.isArray(d.compRecords)||typeof d.initialBalance!=='number'){
          toast('文件格式不正确');return;
        }
        if(!confirm('导入将覆盖当前数据，确认继续？'))return;
        data=d;save();render();toast('导入成功');
        
        // 同步到云端
        if(currentUser){
          showLoading(true);
          try{
            // 1. 先清空云端现有数据
            await supabase.from("duty_log").delete().eq("user_id",currentUser.id);
            await supabase.from("duty_config").delete().eq("user_id",currentUser.id);
            
            // 2. 同步初始天数
            await saveInitialToCloud(data.initialBalance);
            
            // 3. 批量上传值班记录（每批 50 条）
            var dutyPayloads=[];
            (data.dutyRecords||[]).forEach(function(r){
              dutyPayloads.push({
                type:'duty',
                note:r.duty_type||r.note||'',
                duty_type:r.duty_type||'工作日夜班',
                is_used:!!r.is_used,
                rest_change:1,
                create_at:r.date+"T00:00:00Z",
                user_id:currentUser.id
              });
            });
            if(dutyPayloads.length>0){
              var res1=await supabase.from("duty_log").insert(dutyPayloads);
              if(res1.error)throw res1.error;
            }
            
            // 4. 批量上传调休记录
            var compPayloads=[];
            (data.compRecords||[]).forEach(function(r){
              compPayloads.push({
                type:'rest',
                note:r.note||'',
                duty_type:'',
                is_used:false,
                rest_change:-1,
                create_at:r.date+"T00:00:00Z",
                user_id:currentUser.id
              });
            });
            if(compPayloads.length>0){
              var res2=await supabase.from("duty_log").insert(compPayloads);
              if(res2.error)throw res2.error;
            }
            
            toast('云端同步完成');
            await loadCloud();render();
          }catch(syncErr){
            toast('云端同步失败: '+(syncErr.message||'网络异常'));
          }finally{
            showLoading(false);
          }
        }
      }catch(err){toast('解析失败')}
    };
    reader.readAsText(f);ev.target.value='';
  };
  window.clearAllData=async function(){
    if(!confirm('确认清空全部记录？将删除您的所有值班调休记录！'))return;
    if(currentUser){
      await supabase.from("duty_log").delete().eq("user_id",currentUser.id);
      await supabase.from("duty_config").delete().eq("user_id",currentUser.id);
    }
    data={dutyRecords:[],compRecords:[],initialBalance:0};
    document.getElementById('initialInput').value=0;
    save();render();toast('已清空');
  };

  // ==================== 初始化 ====================
  async function init(){
    load();
    document.getElementById('initialInput').value=data.initialBalance;
    if(localStorage.getItem('hintDismissed'))document.getElementById('hintBox').style.display='none';
    await checkAdmin();
    await syncOfflineQueue();
    await loadCloud();
    document.getElementById('initialInput').value=data.initialBalance;
    render();
  }

  // ==================== 认证状态监听 ====================
  supabase.auth.onAuthStateChange(function(event,session){
    if(session&&session.user){
      currentUser=session.user;
      showMainApp();
      document.getElementById('userEmail').textContent=currentUser.email||'';
      if(event==='INITIAL_SESSION'||event==='SIGNED_IN'){
        init();
      }
    }else{
      currentUser=null;
      isAdmin=false;
      document.getElementById('adminBtn').style.display='none';
      data={dutyRecords:[],compRecords:[],initialBalance:0};
      showAuthScreen();
    }
  });

  document.addEventListener('touchmove',function(e){
    if(e.target.closest('.modal-overlay')&&!e.target.closest('.modal-sheet'))e.preventDefault();
  },{passive:false});
})();
</script>
</body>
</html>
