<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="家庭记账管家">
<meta name="theme-color" content="#0ea5e9">
  <title>家庭记账管家</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ==================== CSS Variables ==================== */
:root{
  --primary:#0ea5e9;--primary-dark:#0284c7;--primary-light:#e0f2fe;
  --bg:#f0f4f8;--card:#ffffff;--text:#1e293b;--text-2nd:#64748b;
  --border:#e2e8f0;--success:#16a34a;--success-bg:#dcfce7;
  --warning:#f59e0b;--warning-bg:#fef3c7;
  --danger:#dc2626;--danger-bg:#fee2e2;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 25px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

/* ==================== Loading ==================== */
#loadingOverlay{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#loadingOverlay .spinner{width:40px;height:40px;border:3px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==================== Login ==================== */
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#0ea5e9,#0284c7);display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:#fff;border-radius:20px;padding:40px 32px;width:90%;max-width:380px;box-shadow:var(--shadow-lg)}
.login-card .logo{text-align:center;margin-bottom:28px}
.login-card .logo .icon{font-size:56px}
.login-card .logo h1{font-size:22px;font-weight:700;color:var(--text);margin-top:8px}
.login-card .logo p{font-size:13px;color:var(--text-2nd);margin-top:4px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:13px;font-weight:600;color:var(--text-2nd);margin-bottom:6px}
.input-group input,.input-group select,.input-group textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:15px;color:var(--text);background:#fff;transition:border .2s;outline:none;font-family:inherit}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--primary)}
.input-group textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.login-error{color:var(--danger);font-size:13px;text-align:center;margin-top:12px;min-height:20px}

/* ==================== Main App ==================== */
#app{display:none}
#app.active{display:block}

/* Header */
.app-header{position:sticky;top:0;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.app-header .title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.app-header .vehicle-badge{font-size:12px;opacity:.9;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.app-header .header-actions{display:flex;gap:8px}
.icon-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,.3)}
.icon-btn:active{transform:scale(.92)}

/* Tabs */
.tab-nav{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:57px;z-index:40}
.tab-nav::-webkit-scrollbar{display:none}
.tab-item{flex:0 0 auto;padding:12px 16px;font-size:14px;font-weight:500;color:var(--text-2nd);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab-item.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-item:active{opacity:.7}

/* Content */
.tab-content{display:none;padding:16px;max-width:900px;margin:0 auto}
.tab-content.active{display:block}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}

/* Section Title */
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title h2{font-size:17px;font-weight:700}
.add-btn{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:background .2s;font-family:inherit}
.add-btn:hover{background:var(--primary-dark)}
.add-btn:active{transform:scale(.97)}

/* Tables */
.table-wrap{overflow-x:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:500px}
thead th{background:#f8fafc;padding:10px 12px;text-align:left;font-weight:600;color:var(--text-2nd);border-bottom:2px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fafc}
.row-actions{display:flex;gap:6px}
.row-actions button{border:none;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.action-edit{background:var(--primary-light);color:var(--primary-dark)}
.action-edit:hover{background:#bae6fd}
.action-del{background:var(--danger-bg);color:var(--danger)}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:14px;flex-wrap:wrap}
.pagination button{background:#fff;border:1.5px solid var(--border);color:var(--text-2nd);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.pagination button:hover{background:var(--primary-light);border-color:var(--primary)}
.pagination button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-info{font-size:13px;color:var(--text-2nd);padding:6px 8px}

/* Filter */
.filter-bar{background:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filter-bar .input-group{margin-bottom:0;flex:1;min-width:140px}
.filter-bar .input-group input{padding:8px 10px;font-size:14px}
.filter-bar .btn{padding:9px 16px;font-size:13px}
.action-del:hover{background:#fecaca}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--primary-light);color:var(--primary-dark)}
.tag{display:inline-block;background:var(--primary-light);color:var(--primary-dark);padding:2px 8px;border-radius:6px;font-size:12px;margin:2px}
.empty{text-align:center;padding:40px 20px;color:var(--text-2nd)}
.empty .icon{font-size:48px;margin-bottom:8px}
.empty p{font-size:14px}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-card .label{font-size:12px;color:var(--text-2nd);margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700;color:var(--text)}
.stat-card .value.cost{color:var(--primary)}
.chart-container{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.chart-container h3{font-size:15px;font-weight:600;margin-bottom:12px}
.recent-list{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.recent-list h3{font-size:15px;font-weight:600;margin-bottom:12px}
.recent-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.recent-item:last-child{border-bottom:none}
.recent-item .r-icon{font-size:20px}
.recent-item .r-info{flex:1}
.recent-item .r-title{font-size:14px;font-weight:500}
.recent-item .r-date{font-size:12px;color:var(--text-2nd)}
.recent-item .r-cost{font-size:14px;font-weight:600;color:var(--primary-dark)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;width:100%;max-width:500px;border-radius:16px 16px 0 0;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-header{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:1}
.modal-header h3{font-size:17px;font-weight:700}
.modal-close{border:none;background:none;font-size:22px;cursor:pointer;color:var(--text-2nd);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.modal-close:hover{background:#f1f5f9}
.modal-body{padding:20px}
.form-row{display:flex;gap:12px}
.form-row .input-group{flex:1}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.checkbox-tag{display:flex;align-items:center;gap:4px;padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.checkbox-tag input{display:none}
.checkbox-tag.checked{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);font-weight:600}
.parts-list{margin-bottom:8px}
.part-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.part-row input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit}
.part-row input:focus{border-color:var(--primary)}
.part-row .part-cost{max-width:90px}
.part-row .remove-part{border:none;background:var(--danger-bg);color:var(--danger);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;flex-shrink:0}
.add-part-btn{border:1.5px dashed var(--border);background:none;padding:8px;border-radius:8px;color:var(--text-2nd);cursor:pointer;font-size:13px;width:100%;transition:all .2s;font-family:inherit}
.add-part-btn:hover{border-color:var(--primary);color:var(--primary)}
.modal-footer{position:sticky;bottom:0;background:#fff;padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.btn-secondary{flex:1;background:#f1f5f9;color:var(--text);border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-secondary:hover{background:#e2e8f0}
.modal-footer .btn-primary{flex:1}

/* Toast */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:999;display:none;white-space:nowrap}
#toast.show{display:block;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Cost display */
.cost{font-weight:600;color:var(--primary-dark)}

/* Vehicle info form */
.vehicle-form{max-width:500px;margin:0 auto}

/* Responsive */
@media(min-width:768px){
  .modal-overlay{align-items:center}
  .modal{border-radius:16px}
  .tab-content{padding:20px}
}

@media(max-width:480px){
  .app-header .title{font-size:15px}
  .app-header .vehicle-badge{display:none}
  .stat-card .value{font-size:20px}
}

/* Change Password Modal */
.pw-hint{font-size:12px;color:var(--text-2nd);margin-top:4px}
</style>
</head>
<body>

<!-- Loading -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <p style="color:#64748b;font-size:14px">正在加载...</p>
</div>

<!-- Login Screen -->
<div id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="logo">
      <div class="icon">🏠</div>
      <h1>家庭记账管家</h1>

</div>

<!-- Main App -->
<div id="app">

  </div>

  <!-- Tab Navigation -->
  <div class="tab-nav" id="tabNav">
    <div class="tab-item active" data-tab="dashboard">📊 看板</div>
    <div class="tab-item" data-tab="maintenance">🔧 保养</div>
    <div class="tab-item" data-tab="repair">🔩 维修</div>

    <div class="tab-item" data-tab="shopping">🛍️ 购物</div>

  <!-- Tab Contents -->
  <div class="tab-content active" id="tab-dashboard">
    <div class="stat-grid" id="statGrid"></div>
    <div class="chart-container"><h3>📊 月度费用分布</h3><canvas id="monthlyChart" style="max-height:280px"></canvas></div>
    <div class="chart-container"><h3>⛽ 油耗趋势</h3><canvas id="fuelChart" style="max-height:280px"></canvas></div>
    <div class="recent-list"><h3>📋 最近记录</h3><div id="recentList"></div></div>
  </div>

  <div class="tab-content" id="tab-maintenance"></div>
  <div class="tab-content" id="tab-repair"></div>
  <div class="tab-content" id="tab-fuel"></div>
  <div class="tab-content" id="tab-insurance"></div>
  <div class="tab-content" id="tab-violation"></div>
  <div class="tab-content" id="tab-toll"></div>
  <div class="tab-content" id="tab-inspection"></div>
  <!-- Family expense tabs -->
  <div class="tab-content" id="tab-dining"></div>
  <div class="tab-content" id="tab-shopping"></div>
  <div class="tab-content" id="tab-communication"></div>
  <div class="tab-content" id="tab-electricity"></div>
  <div class="tab-content" id="tab-water"></div>
  <div class="tab-content" id="tab-heating"></div>
  <div class="tab-content" id="tab-property"></div>
  <div class="tab-content" id="tab-social"></div>
  <div class="tab-content" id="tab-vehicle"></div>
  <div class="tab-content" id="tab-export"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">添加记录</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveModalRecord()">保存</button>
    </div>
  </div>
</div>

<!-- Change Password Modal -->
<div class="modal-overlay" id="pwModalOverlay">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h3>修改密码</h3>
      <button class="modal-close" onclick="closePwModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="input-group">
        <label>当前密码</label>
        <input type="password" id="pwOld" placeholder="请输入当前密码">
      </div>
      <div class="input-group">
        <label>新密码</label>
        <input type="password" id="pwNew" placeholder="请输入新密码">
        <p class="pw-hint">至少 6 位</p>
      </div>
      <div class="input-group">
        <label>确认新密码</label>
        <input type="password" id="pwConfirm" placeholder="请再次输入新密码">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closePwModal()">取消</button>
      <button class="btn btn-primary" onclick="handleChangePw()">确认修改</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

// Filter data by date range
function getFilteredByDate(module, dateField){
  var data = allData[module] || [];
  var f = moduleFilters[module] || { startDate:'', endDate:'' };
  var filtered = data;
  if(f.startDate) filtered = filtered.filter(function(r){ return r[dateField] >= f.startDate; });
  if(f.endDate) filtered = filtered.filter(function(r){ return r[dateField] <= f.endDate; });
  return filtered;
}

}

// ==================== Auth ====================
function isLoggedIn(){
  var s = localStorage.getItem(SESSION_KEY);
  if(!s) return false;
  try{ var d = JSON.parse(s); return d.loginTime && (Date.now() - d.loginTime < 7*24*3600*1000); }
  catch(e){ return false; }
}

async function handleLogin(){
  var pw = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  if(!pw){ errEl.textContent = '请输入密码'; return; }
  btn.disabled = true; btn.textContent = '验证中...'; errEl.textContent = '';
  try{
    var { data, error } = await supabase.rpc('verify_car_login', { p_password: pw });
    if(error) throw error;
    if(data === true){
      localStorage.setItem(SESSION_KEY, JSON.stringify({ loginTime: Date.now() }));
      showApp();
    } else {
      errEl.textContent = '密码错误，请重试';
      document.getElementById('loginPassword').select();
    }
  } catch(e){
    errEl.textContent = '连接失败：' + (e.message || '未知错误');
  } finally {
    btn.disabled = false; btn.textContent = '进入系统';
  }
}
window.handleLogin = handleLogin;

function handleLogout(){
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}
window.handleLogout = handleLogout;

function showLogin(){
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginPassword').focus();
}

function showApp(){
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  init();
}

// ==================== Tab Switching ====================
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(function(el){
    el.classList.toggle('active', el.id === 'tab-' + tab);
  });
  var el = document.getElementById('tab-' + tab);
  el.scrollTop = 0;
  if(tab === 'toll') renderToll();
  if(tab === 'export') renderExport();
  if(FAMILY_CATEGORIES[tab]) renderFamilyModule(tab);
}

// ==================== Init ====================
async function init(){
  // Tab events
  document.querySelectorAll('.tab-item').forEach(function(el){
    el.addEventListener('click', function(){ switchTab(el.dataset.tab); });
  });
  await loadVehicleBadge();
  await loadAllData();
  renderDashboard();
  renderMaintenance();
  renderRepair();
  renderFuel();
  renderInsurance();
  renderViolation();
  renderToll();
  renderInspection();
  renderVehicle();
  Object.keys(FAMILY_CATEGORIES).forEach(function(mod){ renderFamilyModule(mod); });
  renderExport();
}

// ==================== Data Loading ====================
async function loadAllData(){
  var tables = ['car_vehicle','car_maintenance','car_repair','car_fuel','car_insurance','car_toll','car_violation','car_inspection'];
  for(var i=0; i<tables.length; i++){
    var t = tables[i];
    var key = t.replace('car_','');
    var { data, error } = await supabase.from(t).select('*').order('id',{ascending:false});
    if(!error) allData[key] = data || [];
    else allData[key] = [];
  }
  // Load family_expenses and distribute by category
  var { data, error } = await supabase.from('family_expenses').select('*').order('id',{ascending:false});
  Object.keys(FAMILY_CATEGORIES).forEach(function(cat){ allData[cat] = []; });
  if(!error && data){
    data.forEach(function(r){
      if(r.category && FAMILY_CATEGORIES[r.category]) allData[r.category].push(r);
    });
  }
}

async function reloadModule(module){
  var table = TABLE_MAP[module];
  if(!table) return;
  var query = supabase.from(table).select('*').order('id',{ascending:false});
  if(FAMILY_CATEGORIES[module]) query = query.eq('category', module);
  var { data } = await query;
  allData[module] = data || [];
  pageState[module].page = 1;
}

async function loadVehicleBadge(){
  var { data } = await supabase.from('car_vehicle').select('*').limit(1);
  if(data && data.length > 0){
    var v = data[0];
    var txt = (v.brand || '') + (v.model ? ' ' + v.model : '') + (v.plate_number ? ' · ' + v.plate_number : '');
    document.getElementById('vehicleBadge').textContent = txt.trim();
  }
}

// ==================== Dashboard ====================
function renderDashboard(){
  var now = new Date();
  var ym = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  var yy = now.getFullYear();

  var totalCost = 0, monthCost = 0, yearCost = 0;
  var fuelCount = 0, expenseCount = 0, rechargeCount = 0;

  // Car modules
  ['maintenance','repair','fuel','insurance','toll','violation','inspection'].forEach(function(mod){
    if(!allData[mod]) return;
    allData[mod].forEach(function(r){
      var cost = parseFloat(r.cost || r.total_cost || r.premium || r.fine_amount || r.total_price || r.amount || 0);
      totalCost += cost;
      var d = (r.service_date || r.repair_date || r.fuel_date || r.toll_date || r.start_date || r.violation_date || r.inspection_date || '').substring(0,7);
      if(d === ym) monthCost += cost;
      var y = (r.service_date || r.repair_date || r.fuel_date || r.toll_date || r.start_date || r.violation_date || r.inspection_date || '').substring(0,4);
      if(parseInt(y) === yy) yearCost += cost;
      if(mod === 'fuel') fuelCount++;
    });
  });

  // Family expense modules (only count 'expense' type, exclude 'recharge')
  Object.keys(FAMILY_CATEGORIES).forEach(function(mod){
    if(!allData[mod]) return;
    allData[mod].forEach(function(r){
      if(r.record_type === 'recharge'){
        rechargeCount++;
        return;
      }
      expenseCount++;
      var cost = parseFloat(r.amount) || 0;
      totalCost += cost;
      var d = (r.expense_date || '').substring(0,7);
      if(d === ym) monthCost += cost;
      var y = (r.expense_date || '').substring(0,4);
      if(parseInt(y) === yy) yearCost += cost;
    });
  });

  // Stat cards
  document.getElementById('statGrid').innerHTML =
    statCard('本月支出', formatMoney(monthCost), 'cost') +
    statCard('本年支出', formatMoney(yearCost), 'cost') +
    statCard('累计支出', formatMoney(totalCost), 'cost') +
    statCard('加油次数', fuelCount + '次', '');

  // Monthly chart
  renderMonthlyChart();
  // Fuel chart
  renderFuelChart();
  // Recent list
  renderRecentList();
}

function statCard(label, value, cls){
  return '<div class="stat-card"><div class="label">'+label+'</div><div class="value '+(cls||'')+'">'+value+'</div></div>';
}

function renderMonthlyChart(){
  var months = {};
  var now = new Date();
  for(var i=5; i>=0; i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')] = { maintenance:0, repair:0, fuel:0, toll:0, family:0, other:0 };
  }

  // Car modules (fuel: only expense, not recharge)
  ['maintenance','repair','fuel','insurance','toll','violation','inspection'].forEach(function(mod){
    if(!allData[mod]) return;
    allData[mod].forEach(function(r){
      var dateField = r.service_date || r.repair_date || r.fuel_date || r.toll_date || r.start_date || r.violation_date || r.inspection_date || '';
      var ym = dateField.substring(0,7);
      if(!months[ym]) return;
      var cost = parseFloat(r.cost || r.total_cost || r.premium || r.fine_amount || r.total_price || r.amount || 0);
      if(mod === 'maintenance') months[ym].maintenance += cost;
      else if(mod === 'repair') months[ym].repair += cost;
      else if(mod === 'fuel') months[ym].fuel += cost;
      else if(mod === 'toll') months[ym].toll += cost;
      else months[ym].other += cost;
    });
  });

  // Family expense modules (only expense, not recharge)
  Object.keys(FAMILY_CATEGORIES).forEach(function(mod){
    if(!allData[mod]) return;
    allData[mod].forEach(function(r){
      if(r.record_type === 'recharge') return; // skip recharge
      var ym = (r.expense_date || '').substring(0,7);
      if(!months[ym]) return;
      var cost = parseFloat(r.amount) || 0;
      months[ym].family += cost;
    });
  });

  var labels = Object.keys(months);
  var ctx = document.getElementById('monthlyChart').getContext('2d');
  if(monthlyChart) monthlyChart.destroy();
  monthlyChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels.map(function(m){ return m.substring(5); }),
      datasets: [
        { label:'保养', data:labels.map(function(m){return months[m].maintenance;}), backgroundColor:'#0ea5e9' },
        { label:'维修', data:labels.map(function(m){return months[m].repair;}), backgroundColor:'#f59e0b' },
        { label:'加油', data:labels.map(function(m){return months[m].fuel;}), backgroundColor:'#16a34a' },
        { label:'高速费', data:labels.map(function(m){return months[m].toll;}), backgroundColor:'#f59e0b' },
        { label:'家庭支出', data:labels.map(function(m){return months[m].family;}), backgroundColor:'#8b5cf6' },
        { label:'其他', data:labels.map(function(m){return months[m].other;}), backgroundColor:'#94a3b8' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position:'bottom', labels:{boxWidth:12,padding:8,font:{size:11} } } },
      scales: { x:{stacked:true,grid:{display:false}}, y:{stacked:true,beginAtZero:true,ticks:{callback:function(v){return v>0?v:'';}}} }
    }
  });
}

function renderFuelChart(){
  var fuels = (allData.fuel || []).slice().sort(function(a,b){
    return (a.fuel_date||'').localeCompare(b.fuel_date||'');
  }).slice(-12);
  
  var labels = fuels.map(function(f){ return (f.fuel_date||'').substring(5); });
  var data = fuels.map(function(f){
    var liters = parseFloat(f.liters || 0);
    var prevMile = null;
    var idx = fuels.indexOf(f);
    if(idx > 0) prevMile = fuels[idx-1].mileage;
    if(prevMile && f.mileage && liters > 0){
      var dist = f.mileage - prevMile;
      if(dist > 0) return Math.round(liters / dist * 100 * 10) / 10;
    }
    return null;
  });
  
  var ctx = document.getElementById('fuelChart').getContext('2d');
  if(fuelChart) fuelChart.destroy();
  fuelChart = new Chart(ctx, {
    type: 'line',
    data: { labels: labels, datasets:[{ label:'百公里油耗(L)', data:data, borderColor:'#0ea5e9', backgroundColor:'rgba(14,165,233,.1)', fill:true, tension:.3, pointRadius:4, pointBackgroundColor:'#0ea5e9' }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ y:{beginAtZero:true,ticks:{callback:function(v){return v+'L';}}} }
    }
  });
}

function renderRecentList(){
  var items = [];
  ['maintenance','repair','fuel','insurance','toll','violation','inspection'].forEach(function(mod){
    if(!allData[mod]) return;
    allData[mod].forEach(function(r){
      var date = r.service_date || r.repair_date || r.fuel_date || r.toll_date || r.start_date || r.violation_date || r.inspection_date || '';
      var cost = parseFloat(r.cost || r.total_cost || r.premium || r.fine_amount || r.total_price || r.amount || 0);
      var icon = { maintenance:'🔧', repair:'🔩', fuel:'⛽', insurance:'📋', toll:'🛣️', violation:'⚠️', inspection:'📅' }[mod];
      var title = '';
      if(mod === 'maintenance') title = (r.items && r.items.length ? r.items.join('、') : '保养');
      else if(mod === 'repair') title = r.issue_description || '维修';
      else if(mod === 'fuel') title = r.fuel_type + ' ' + (r.liters||0) + 'L';
      else if(mod === 'toll') title = (r.entrance||'') + ' → ' + (r.exit||'');
      else if(mod === 'insurance') title = r.insurance_type || '保险';
      else if(mod === 'violation') title = r.violation_type || '违章';
      else if(mod === 'inspection') title = '年检' + (r.result === '通过' ? '通过' : '未通过');
      items.push({ date:date, icon:icon, title:title, cost:cost });
    });
  });
  // Family modules - only expense, not recharge
  Object.keys(FAMILY_CATEGORIES).forEach(function(mod){
    if(!allData[mod]) return;
    allData[mod].forEach(function(r){
      if(r.record_type === 'recharge') return; // skip recharge
      var date = r.expense_date || '';
      var cost = parseFloat(r.amount) || 0;
      var iconMap = { dining:'🍽️', shopping:'🛍️', communication:'📱', electricity:'⚡', water:'💧', heating:'🔥', property:'🏠', social:'🎁' };
      var icon = iconMap[mod] || '📝';
      var title = r.merchant || FAMILY_CATEGORIES[mod].title;
      if(mod === 'shopping' && r.items && r.items.length) title = r.items.join('、');
      items.push({ date:date, icon:icon, title:title, cost:cost });
    });
  });
  items.sort(function(a,b){ return b.date.localeCompare(a.date); });
  items = items.slice(0, 10);
  
  if(items.length === 0){
    document.getElementById('recentList').innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无记录，去添加吧！</p></div>';
    return;
  }
  
  var html = items.map(function(it){
    return '<div class="recent-item"><span class="r-icon">'+it.icon+'</span><div class="r-info"><div class="r-title">'+escapeHtml(it.title)+'</div><div class="r-date">'+formatDate(it.date)+'</div></div><span class="r-cost">'+(it.cost>0?formatMoney(it.cost):'')+'</span></div>';
  }).join('');
  document.getElementById('recentList').innerHTML = html;
}

    '<div class="input-group"><label>入口</label><input type="text" id="toll_entrance" placeholder="如：北京西" value="'+escapeAttr(tollFilter.entrance)+'"></div>'+

    '<div class="input-group"><label>备注关键词</label><input type="text" id="toll_kw" placeholder="如：上班、回安国" value="'+escapeAttr(tollFilter.keyword)+'"></div>'+

    filtered = filtered.filter(function(r){ return (r.exit||'').toLowerCase().indexOf(kw) >= 0; });
  }
  if(tollFilter.keyword){
    var kw = tollFilter.keyword.toLowerCase();

    '</div>'+
    '<div style="background:#fff;border-radius:10px;padding:10px 16px;box-shadow:var(--shadow);flex:1;text-align:center">'+
      '<div style="font-size:12px;color:var(--text-2nd)">总费用</div>'+
      '<div style="font-size:20px;font-weight:700;color:var(--danger)">'+formatMoney(totalCost)+'</div>'+
    '</div>'+
  '</div>';

    el.innerHTML = html + emptyState('🛣️');
    return;
  }
  
  // 分页
  var st = pageState.toll;
  var totalPages = Math.max(1, Math.ceil(totalCount / st.size));
  if(st.page > totalPages) st.page = totalPages;

  pageData.forEach(function(r){
    html += '<tr><td>'+formatDate(r.toll_date)+'</td><td>'+(r.mileage?r.mileage+' km':'-')+'</td><td>'+escapeHtml(r.entrance||'-')+'</td><td>'+escapeHtml(r.exit||'-')+'</td><td class="cost">'+formatMoney(r.amount)+'</td><td style="font-size:12px;color:#64748b;line-height:1.5;word-break:break-all;min-width:120px" title="'+escapeAttr(r.notes||'')+'">'+escapeHtml(r.notes||'-')+'</td><td><div class="row-actions"><button class="action-edit" onclick="openModal(\'toll\','+r.id+')">✏️</button><button class="action-del" onclick="deleteRecord(\'toll\','+r.id+')">🗑️</button></div></td></tr>';

function saveVehicle(id){
  var data = {
    brand: val('v_brand'),
    model: val('v_model'),
    plate_number: val('v_plate_number'),
    vin: val('v_vin'),
    purchase_date: val('v_purchase_date') || null,
    purchase_price: parseFloat(val('v_purchase_price')) || 0,
    notes: val('v_notes'),
    updated_at: new Date().toISOString()
  };
  saveVehicleAsync(id, data);
}
window.saveVehicle = saveVehicle;

async function saveVehicleAsync(id, data){
  try{
    if(id){
      var { error } = await supabase.from('car_vehicle').update(data).eq('id', id);
    } else {
      var { error } = await supabase.from('car_vehicle').insert(data);
    }
    if(error) throw error;
    showToast('保存成功');
    var { data:vd } = await supabase.from('car_vehicle').select('*').limit(1);
    allData.vehicle = vd || [];
    await loadVehicleBadge();
    renderVehicle();
  } catch(e){
    showToast('保存失败：'+(e.message||''), 'error');
  }
}

function openModal(module, id){

  document.getElementById('modalTitle').textContent = title;

  if(module === 'maintenance') body.innerHTML = maintenanceForm(id);
  else if(module === 'repair') body.innerHTML = repairForm(id);
  else if(module === 'fuel') body.innerHTML = fuelForm(id);
  else if(module === 'insurance') body.innerHTML = insuranceForm(id);
  else if(module === 'violation') body.innerHTML = violationForm(id);
  else if(module === 'toll') body.innerHTML = tollForm(id);
  else if(module === 'inspection') body.innerHTML = inspectionForm(id);
  else if(FAMILY_CATEGORIES[module]) body.innerHTML = familyForm(module, id);
  
  document.getElementById('modalOverlay').classList.add('active');

  if(module === 'maintenance') {/* checkbox tags use onclick */}

  if(module === 'fuel') initFuelCalc();
}

// ==================== Save Record ====================
async function saveModalRecord(){
  if(!editingModule) return;
  var module = editingModule;
  var id = editingId;
  var table = TABLE_MAP[module];
  
  var data = {};
  try{
    if(module === 'maintenance'){
      data.service_date = val('m_date');
      data.mileage = parseInt(val('m_mileage')) || 0;
      data.items = getCheckedItems();
      data.shop = val('m_shop');
      data.cost = parseFloat(val('m_cost')) || 0;
      data.notes = val('m_notes');
    } else if(module === 'repair'){
      data.repair_date = val('r_date');
      data.mileage = parseInt(val('r_mileage')) || 0;
      data.issue_description = val('r_issue');
      data.repair_items = val('r_items');
      data.parts = collectParts();
      data.shop = val('r_shop');
      data.total_cost = parseFloat(val('r_cost')) || 0;
      data.notes = val('r_notes');
    } else if(module === 'fuel'){
      data.fuel_date = val('f_date');
      data.mileage = parseInt(val('f_mileage')) || 0;
      data.fuel_type = val('f_type');
      data.liters = parseFloat(val('f_liters')) || 0;
      data.price_per_liter = parseFloat(val('f_price')) || 0;
      data.total_price = parseFloat(val('f_total')) || 0;
      data.station = val('f_station');
      data.notes = val('f_notes') || '';
    } else if(module === 'insurance'){
      data.insurance_type = val('i_type');
      data.company = val('i_company');
      data.start_date = val('i_start');
      data.end_date = val('i_end') || null;
      data.premium = parseFloat(val('i_premium')) || 0;
      data.policy_number = val('i_policy');
      data.claim_records = val('i_claim');
    } else if(module === 'toll'){
      data.toll_date = val('to_date');
      data.mileage = parseInt(val('to_mileage')) || 0;
      data.entrance = val('to_entrance');
      data.exit = val('to_exit');
      data.amount = parseFloat(val('to_amount')) || 0;
      data.notes = val('to_notes');
    } else if(module === 'violation'){
      data.violation_date = val('v_date');
      data.violation_type = val('v_type');
      data.location = val('v_location');
      data.fine_amount = parseFloat(val('v_fine')) || 0;
      data.demerit_points = parseInt(val('v_points')) || 0;
      data.status = val('v_status');
      data.notes = val('v_notes');
    } else if(module === 'inspection'){
      data.inspection_date = val('in_date');
      data.result = val('in_result');
      data.next_due_date = val('in_next') || null;
      data.cost = parseFloat(val('in_cost')) || 0;
      data.notes = val('in_notes');
    } else if(FAMILY_CATEGORIES[module]){
      data.category = module;
      data.record_type = val(module+'_record_type') || 'expense';
      data.expense_date = val(module+'_date');
      data.amount = parseFloat(val(module+'_amount')) || 0;
      data.payment_method = val(module+'_payment') || '';
      data.merchant = val(module+'_merchant') || '';
      data.notes = val(module+'_notes') || '';
      // For shopping, items is a text list; for others, leave empty
      if(module === 'shopping'){
        var itemsText = val(module+'_items') || '';
        data.items = itemsText ? itemsText.split(/[,，]/).map(function(s){ return s.trim(); }).filter(function(s){ return s; }) : [];
      }
      if(module === 'communication'){
        data.merchant = val(module+'_merchant') || '运营商';
      }
      if(module === 'electricity'){
        data.merchant = val(module+'_merchant') || '供电局';
      }
    }
  } catch(e){
    showToast('数据格式错误', 'error');
    return;
  }
  
  document.getElementById('modalSaveBtn').disabled = true;
  try{
    if(id){
      var { error } = await supabase.from(table).update(data).eq('id', id);
      if(FAMILY_CATEGORIES[module]) {
        await supabase.from(table).update(data).eq('id', id).eq('category', module);
      }
    } else {
      var { error } = await supabase.from(table).insert(data);
    }
    if(error) throw error;
    closeModal();
    showToast('保存成功');
    await reloadModule(module);
    // Re-render affected views
    renderModule(module);
    renderDashboard();
  } catch(e){
    showToast('保存失败：'+(e.message||''), 'error');
  } finally {
    document.getElementById('modalSaveBtn').disabled = false;
  }
}
window.saveModalRecord = saveModalRecord;

// ==================== Delete ====================
async function deleteRecord(module, id){
  if(!confirm('确定要删除这条记录吗？')) return;
  var table = TABLE_MAP[module];
  if(!table) return;
  try{
    var query = supabase.from(table).delete().eq('id', id);
    if(FAMILY_CATEGORIES[module]) query = query.eq('category', module);
    var { error } = await query;
    if(error) throw error;
    showToast('删除成功');
    await reloadModule(module);
    pageState[module].page = 1;
    renderModule(module);
    renderDashboard();
  } catch(e){
    showToast('删除失败：'+(e.message||''), 'error');
  }
}
window.deleteRecord = deleteRecord;

function openPwModal(){
  document.getElementById('pwModalOverlay').classList.add('active');

}

async function handleChangePw(){
  var oldPw = document.getElementById('pwOld').value;
  var newPw = document.getElementById('pwNew').value;
  var confPw = document.getElementById('pwConfirm').value;
  if(!oldPw || !newPw || !confPw){ showToast('请填写完整', 'error'); return; }
  if(newPw.length < 6){ showToast('新密码至少6位', 'error'); return; }
  if(newPw !== confPw){ showToast('两次密码不一致', 'error'); return; }
  try{
    var { data, error } = await supabase.rpc('change_car_password', { p_old_password: oldPw, p_new_password: newPw });
    if(error) throw error;
    if(data === true){
      closePwModal();
      showToast('密码修改成功');
    } else {
      showToast('原密码错误', 'error');
    }
  } catch(e){
    showToast('修改失败：'+(e.message||''), 'error');
  }
}

function formatDate(d){
  if(!d) return '-';
  return d.substring(0,10);
}
function formatMoney(n){
  n = parseFloat(n) || 0;
  return n > 0 ? n.toFixed(2) + ' 元' : '-';
}
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
var toastTimer;
function showToast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type === 'error' ? 'rgba(220,38,38,.9)' : 'rgba(0,0,0,.8)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

// Parts list (repair)
function addPartRow(name, cost){
  var div = document.createElement('div');
  div.className = 'part-row';
  div.innerHTML = '<input type="text" class="part-name" placeholder="零件名称" value="'+escapeAttr(name||'')+'"><input type="number" class="part-cost" placeholder="费用" value="'+escapeAttr(cost||'')+'" step="0.01"><button class="remove-part" onclick="this.parentElement.remove();updateRepairCost()">&times;</button>';
  document.getElementById('partsList').appendChild(div);
  div.querySelector('.part-cost').addEventListener('input', updateRepairCost);
}
window.addPartRow = addPartRow;
function initPartsList(){
  var list = document.getElementById('partsList');
  if(!list) return;
  list.innerHTML = '';
  if(pendingParts && pendingParts.length){
    pendingParts.forEach(function(p){ addPartRow(p.name, p.cost); });
  }
  var totalInput = document.getElementById('r_cost');
  if(totalInput && (!totalInput.value || parseFloat(totalInput.value) === 0)){
    updateRepairCost();
  }
}
function collectParts(){
  var parts = [];
  document.querySelectorAll('#partsList .part-row').forEach(function(row){
    var name = row.querySelector('.part-name').value.trim();
    var cost = parseFloat(row.querySelector('.part-cost').value) || 0;
    if(name) parts.push({ name:name, cost:cost });
  });
  return parts;
}
function updateRepairCost(){
  var total = 0;
  document.querySelectorAll('#partsList .part-cost').forEach(function(input){
    total += parseFloat(input.value) || 0;
  });
  var totalInput = document.getElementById('r_cost');
  if(totalInput) totalInput.value = total.toFixed(2);
}

function initFuelCalc(){
  var liters = document.getElementById('f_liters');
  var price = document.getElementById('f_price');
  var total = document.getElementById('f_total');
  if(!liters || !price || !total) return;
  var calc = function(){
    var l = parseFloat(liters.value) || 0;
    var p = parseFloat(price.value) || 0;
    if(l > 0 && p > 0) total.value = (l * p).toFixed(2);
  };
  liters.addEventListener('input', calc);
  price.addEventListener('input', calc);
}

// ==================== Export Excel ====================
function exportModule(module){
  var modules = module ? [module] : ['maintenance','repair','fuel','insurance','toll','violation','inspection','dining','shopping','communication','electricity','water','heating','property','social'];
  var hasData = false;
  modules.forEach(function(m){
    if((allData[m]||[]).length > 0) hasData = true;
  });
  if(!hasData){ showToast('没有记录可导出', 'error'); return; }
  
  var wb = XLSX.utils.book_new();
  var sheetConfigs = {
    maintenance: { title:'保养记录', headers:['日期','里程(km)','保养项目','店铺','费用(元)','备注'], mapFn:function(r){ return [formatDate(r.service_date), r.mileage||'', (r.items||[]).join('、'), r.shop||'', r.cost||0, r.notes||'']; } },
    repair: { title:'维修记录', headers:['日期','里程(km)','故障描述','维修项目','零件及费用','店铺','总费用(元)','备注'], mapFn:function(r){ var ps=(r.parts||[]).map(function(p){return(p.name||'')+':'+(p.cost||0);}).join('; '); return [formatDate(r.repair_date), r.mileage||'', r.issue_description||'', r.repair_items||'', ps, r.shop||'', r.total_cost||0, r.notes||'']; } },
    fuel: { title:'加油记录', headers:['日期','里程(km)','油品型号','加油量(L)','单价(元/L)','总价(元)','加油站','备注'], mapFn:function(r){ return [formatDate(r.fuel_date), r.mileage||'', r.fuel_type||'', r.liters||0, r.price_per_liter||0, r.total_price||0, r.station||'', r.notes||'']; } },
    insurance: { title:'保险记录', headers:['险种','保险公司','起保日期','到期日期','保费(元)','保单号','理赔记录'], mapFn:function(r){ return [r.insurance_type||'', r.company||'', formatDate(r.start_date), r.end_date?formatDate(r.end_date):'长期', r.premium||0, r.policy_number||'', r.claim_records||'']; } },
    violation: { title:'违章记录', headers:['日期','违章类型','地点','罚款(元)','扣分','状态','备注'], mapFn:function(r){ return [formatDate(r.violation_date), r.violation_type||'', r.location||'', r.fine_amount||0, r.demerit_points||0, r.status||'', r.notes||'']; } },
    inspection: { title:'年检记录', headers:['检测日期','结果','下次到期','费用(元)','备注'], mapFn:function(r){ return [formatDate(r.inspection_date), r.result||'', r.next_due_date?formatDate(r.next_due_date):'', r.cost||0, r.notes||'']; } },
    toll: { title:'高速费记录', headers:['日期','里程(km)','入口','出口','费用(元)','备注'], mapFn:function(r){ return [formatDate(r.toll_date), r.mileage||'', r.entrance||'', r.exit||'', r.amount||0, r.notes||'']; } },
    dining: { title:'餐饮记录', headers:['类型','日期','商家','金额(元)','支付方式','备注'], mapFn:function(r){ return [r.record_type==='expense'?'消费':'充值', formatDate(r.expense_date), r.merchant||'', r.amount||0, r.payment_method||'', r.notes||'']; } },
    shopping: { title:'购物记录', headers:['类型','日期','物品清单','商家','金额(元)','支付方式','备注'], mapFn:function(r){ return [r.record_type==='expense'?'消费':'充值', formatDate(r.expense_date), (r.items||[]).join('、'), r.merchant||'', r.amount||0, r.payment_method||'', r.notes||'']; } },
    communication: { title:'通讯记录', headers:['类型','日期','运营商','金额(元)','支付方式','备注'], mapFn:function(r){ return [r.record_type==='expense'?'消费':'充值', formatDate(r.expense_date), r.merchant||'', r.amount||0, r.payment_method||'', r.notes||'']; } },
    electricity: { title:'电费记录', headers:['类型','日期','供电单位','金额(元)','支付方式','备注'], mapFn:function(r){ return [r.record_type==='expense'?'消费':'充值', formatDate(r.expense_date), r.merchant||'', r.amount||0, r.payment_method||'', r.notes||'']; } },
    water: { title:'水费记录', headers:['日期','供水单位','金额(元)','支付方式','备注'], mapFn:function(r){ return [formatDate(r.expense_date), r.merchant||'', r.amount||0, r.payment_method||'', r.notes||'']; } },
    heating: { title:'取暖记录', headers:['日期','供暖单位','金额(元)','支付方式','备注'], mapFn:function(r){ return [formatDate(r.expense_date), r.merchant||'', r.amount||0, r.payment_method||'', r.notes||'']; } },
    property: { title:'物业记录', headers:['日期','物业公司','金额(元)','支付方式','备注'], mapFn:function(r){ return [formatDate(r.expense_date), r.merchant||'', r.amount||0, r.payment_method||'', r.notes||'']; } },
    social: { title:'人情往来', headers:['日期','对象/场合','金额(元)','支付方式','备注'], mapFn:function(r){ return [formatDate(r.expense_date), r.merchant||'', r.amount||0, r.payment_method||'', r.notes||'']; } }
  };
  
  modules.forEach(function(m){
    var cfg = sheetConfigs[m];
    var data = allData[m] || [];
    if(data.length === 0) return;
    var aoa = [cfg.headers].concat(data.map(cfg.mapFn));
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var colWidths = cfg.headers.map(function(h){ return {wch: Math.max(h.length, 12)}; });
    ws['!cols'] = colWidths;
    XLSX.utils.book_append_sheet(wb, ws, cfg.title);
  });
  
  XLSX.writeFile(wb, '家庭记账_' + todayStr() + '.xlsx');
  showToast('✅ 已导出：家庭记账_' + todayStr() + '.xlsx');
}
window.exportModule = exportModule;

// ==================== Boot ====================
function boot(){
  // Check if Supabase SDK loaded
  if(!supabase){
    document.getElementById('loadingOverlay').innerHTML = 
      '<div style="text-align:center;padding:20px;color:#64748b;max-width:320px">' +
      '<div style="font-size:40px;margin-bottom:12px">⚠️</div>' +
      '<p style="font-size:15px;font-weight:600;color:#dc2626;margin-bottom:8px">无法加载依赖库</p>' +
      '<p style="font-size:13px;line-height:1.6">页面需要联网加载 Supabase SDK，请检查网络连接后刷新页面。</p>' +
      '<p style="font-size:12px;color:#94a3b8;margin-top:12px">如网络正常仍无法打开，请将 HTML 文件部署到 GitHub Pages 后访问。</p>' +
      '</div>';
    return;
  }
  if(isLoggedIn()){
    showApp();
  } else {
    showLogin();
  }
  // Enter key on login
  var pwInput = document.getElementById('loginPassword');
  if(pwInput) pwInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') handleLogin();
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
